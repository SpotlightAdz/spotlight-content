<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Spotlight Adz Trailer</title>
<style>
@font-face { font-family: Readex; src: url(fonts/readex-500.ttf); font-weight: 500; }
@font-face { font-family: Readex; src: url(fonts/readex-600.ttf); font-weight: 600; }
@font-face { font-family: Readex; src: url(fonts/readex-700.ttf); font-weight: 700; }
@font-face { font-family: SG; src: url(fonts/space-grotesk-500.ttf); font-weight: 500; }
@font-face { font-family: SG; src: url(fonts/space-grotesk-600.ttf); font-weight: 600; }
@font-face { font-family: SG; src: url(fonts/space-grotesk-700.ttf); font-weight: 700; }
@font-face { font-family: IT; src: url(fonts/inter-tight-500.ttf); font-weight: 500; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #05040c; }
#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
#stage { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 46%; }
.scene { position: absolute; inset: 0; transform-style: preserve-3d; display: none; }
.abs { position: absolute; }
.ar { font-family: Readex, sans-serif; direction: rtl; }
.sg { font-family: SG, sans-serif; letter-spacing: -0.02em; }
.it { font-family: IT, sans-serif; }
.c { left: 0; right: 0; text-align: center; }
.white { color: #fff; text-shadow: 0 0 30px rgba(255,255,255,.25); }
.shim { background: linear-gradient(90deg,#FFB800,#FF7A1A,#FF3D6E,#D926B3,#8C46FF,#2F7BFF,#22D3EE,#FFB800,#FF7A1A,#FF3D6E);
  background-size: 400% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 26px rgba(255,70,160,.55)) drop-shadow(0 0 60px rgba(120,80,255,.35)); }
.glass { background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.05));
  backdrop-filter: blur(26px) saturate(170%); -webkit-backdrop-filter: blur(26px) saturate(170%);
  border: 1.5px solid rgba(255,255,255,.26); border-radius: 44px;
  box-shadow: 0 40px 90px rgba(0,0,0,.5), inset 0 1.5px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(255,255,255,.08); }
.rim { position: absolute; inset: -2px; border-radius: inherit; padding: 2px; pointer-events: none;
  background: conic-gradient(from var(--a,0deg), #FFB800, #FF3D6E, #D926B3, #8C46FF, #2F7BFF, #22D3EE, #FFB800);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  filter: drop-shadow(0 0 14px rgba(255,90,180,.8)); }
.pill { border-radius: 999px; padding: 18px 40px; display: inline-block; }
.tag { position: absolute; top: 250px; left: 0; right: 0; text-align: center; }
.tag span { font-family: SG; font-weight: 600; font-size: 34px; letter-spacing: .18em; color: rgba(255,255,255,.9); }
.chip { position: absolute; font-family: SG; font-weight: 600; font-size: 38px; color: #fff; padding: 20px 34px; border-radius: 999px; white-space: nowrap; }
.num { font-family: SG; font-weight: 700; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; mix-blend-mode: screen; pointer-events: none; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 80% at 50% 45%, transparent 55%, rgba(0,0,0,.55) 100%); }
.heart { position: absolute; width: 70px; height: 70px; }
svg { overflow: visible; }
</style>
</head>
<body>
<canvas id="gl" width="540" height="960"></canvas>
<div id="stage"></div>
<div id="vig"></div>
<div id="flash"></div>
<script type="module">
import * as THREE from './assets/three.module.min.js';

// ---------------- timing (128 BPM) ----------------
const BPM = 128, BEAT = 60 / BPM, BAR = BEAT * 4;
const T = {
  hookEnd: 2 * BAR, logoEnd: 4 * BAR,                         // 3.75, 7.5
  svc: i => 4 * BAR + i * 3 * BAR,                            // 6 services, 3 bars each
  proof: 22 * BAR, cta: 24 * BAR, end: 24 * BAR + 3.6 * BAR    // 41.25, 45, ~51.75
};
window.TOTAL = T.end;

// ---------------- helpers ----------------
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, d) => cl((t - a) / d);
const eo = x => 1 - Math.pow(1 - cl(x), 3);
const eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eb = x => { x = cl(x); const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const es = (x, k = 6, w = 12) => { x = cl(x); return x >= 1 ? 1 : 1 - Math.exp(-k * x) * Math.cos(w * x); };
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstChild; };
function S(el, o) {           // set transform & style
  const tr = `translate3d(${o.x||0}px,${o.y||0}px,${o.z||0}px) rotateX(${o.rx||0}deg) rotateY(${o.ry||0}deg) rotateZ(${o.r||0}deg) scale(${o.s===undefined?1:o.s})`;
  el.style.transform = tr;
  if (o.o !== undefined) el.style.opacity = o.o;
  if (o.blur !== undefined) el.style.filter = o.blur > .2 ? `blur(${o.blur}px)` : '';
}
const SPEC = ['#FFB800','#FF7A1A','#FF3D6E','#D926B3','#8C46FF','#2F7BFF','#22D3EE'];

// ---------------- icons ----------------
const IC = {
  social: `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M50 84 C20 64 10 48 10 34 C10 22 20 13 31 13 C40 13 46 18 50 25 C54 18 60 13 69 13 C80 13 90 22 90 34 C90 48 80 64 50 84Z" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/></svg>`,
  ads: `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M14 40 L60 20 L60 80 L14 60 Z M60 34 C76 36 76 64 60 66 M24 62 L30 86 L42 86 L38 64" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/></svg>`,
  web: `<svg viewBox="0 0 100 100" width="100%" height="100%"><rect x="10" y="18" width="80" height="54" rx="8" fill="none" stroke="#fff" stroke-width="7"/><path d="M34 86 L66 86 M50 72 L50 86 M10 32 L90 32" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg>`,
  sys: `<svg viewBox="0 0 100 100" width="100%" height="100%"><rect x="12" y="12" width="32" height="32" rx="7" fill="none" stroke="#fff" stroke-width="7"/><rect x="56" y="12" width="32" height="32" rx="7" fill="none" stroke="#fff" stroke-width="7"/><rect x="12" y="56" width="32" height="32" rx="7" fill="none" stroke="#fff" stroke-width="7"/><rect x="56" y="56" width="32" height="32" rx="7" fill="#fff"/></svg>`,
  brand: `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M50 10 L72 50 L50 90 L28 50 Z M50 10 L50 58 M50 58 a6 6 0 1 0 0.1 0" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/></svg>`,
  ai: `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M46 10 C49 34 56 41 80 44 C56 47 49 54 46 78 C43 54 36 47 12 44 C36 41 43 34 46 10Z" fill="#fff"/><path d="M78 66 C79 74 82 77 90 78 C82 79 79 82 78 90 C77 82 74 79 66 78 C74 77 77 74 78 66Z" fill="#fff"/></svg>`,
  chat: `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M50 12 C28 12 12 27 12 46 C12 56 16 64 23 70 L18 88 L37 79 C41 80 45 81 50 81 C72 81 88 66 88 46 C88 27 72 12 50 12Z" fill="#fff"/><path d="M38 34 C36 44 44 56 58 60 L64 54 L56 48 L52 52 C46 49 43 45 42 40 L46 36 L40 28Z" fill="#25D366"/></svg>`,
  check: `<svg viewBox="0 0 100 100" width="100%" height="100%"><path d="M18 52 L40 74 L84 26" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>`

const SERVICES = [

// ---------------- WebGL background ----------------
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(540, 960, false);
const scene = new THREE.Scene(); const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const U = { uT: { value: 0 }, uEdge: { value: 0 }, uEnergy: { value: .6 }, uWarp: { value: 0 }, uFlash: { value: 0 }, uHue: { value: 0 }, uDark: { value: 1 } };
const frag = `
precision highp float; varying vec2 vUv;
uniform float uT, uEdge, uEnergy, uWarp, uFlash, uHue, uDark;
vec3 spec(float u){ u = fract(u)*7.0;
  vec3 c[7]; c[0]=vec3(1.,.72,0.); c[1]=vec3(1.,.48,.10); c[2]=vec3(1.,.24,.43); c[3]=vec3(.85,.15,.70); c[4]=vec3(.55,.27,1.); c[5]=vec3(.18,.48,1.); c[6]=vec3(.13,.83,.93);
  int i = int(floor(u)); float f = fract(u); vec3 a = c[0], b = c[1];
  for(int k=0;k<7;k++){ if(k==i){ a=c[k]; b=c[k==6?0:k+1]; } } return mix(a,b,smoothstep(0.,1.,f)); }
float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float sdRR(vec2 p, vec2 b, float r){ vec2 q = abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
void main(){
  vec2 uv = vUv; vec2 p = (uv-.5)*vec2(1.,1.7778);
  vec3 col = vec3(.02,.016,.05)*uDark;
  // mesh orbs
  for(int k=0;k<5;k++){ float fk=float(k);
    vec2 c = vec2(.5+.33*sin(uT*.23+fk*1.9), .5+.36*cos(uT*.19+fk*1.3))-.5; c.y*=1.7778;
    float d = length(p-c); float r = .55+.12*sin(uT*.3+fk);
    col += spec(fk*.19+uT*.02+uHue)*exp(-d*d/(r*r)*2.4)*.38*uEnergy; }
  // warp streaks
  if(uWarp>.001){ float a = atan(p.y,p.x); float r = length(p);
    float n = 180.; float cell = floor(a/6.2832*n); float rnd = h21(vec2(cell, 3.1));
    float z = fract(rnd*7. - uT*(1.2+rnd*2.) ); float len = .06+ .5*uWarp;
    float s = smoothstep(len, 0., abs(r - z*1.4)) * smoothstep(.0, .25, r) * step(.55, rnd);
    float w = smoothstep(.5/n, 0., abs(fract(a/6.2832*n)-.5)/n);
    col += spec(rnd+uT*.1)*s*w*uWarp*2.2; }
  // edge glow (screen rim)
  float d = abs(sdRR(p, vec2(.5,.8889)-.006, .11));
  float ang = atan(p.y, p.x)/6.2832;
  vec3 ec = spec(ang*2.+uT*.35);
  float wob = .72+.28*sin(ang*37.7+uT*3.);
  col += ec*(exp(-pow(d/.006,2.))*.9 + exp(-d/.05)*.55)*uEdge*wob;
  col += ec*exp(-d/.16)*.22*uEdge;
  col += vec3(1.)*uFlash;
  // vignette + grain-free tone
  col *= 1.0 - .35*smoothstep(.6, 1.25, length(p*vec2(1.2,.75)));
  gl_FragColor = vec4(pow(col, vec3(.95)), 1.);
}`;
const mat = new THREE.ShaderMaterial({ uniforms: U, vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy,0.,1.); }`, fragmentShader: frag });
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

// ---------------- build DOM scenes ----------------

const scenes = {};
function mk(id) { const s = $(`<div class="scene" id="${id}"></div>`); stage.appendChild(s); scenes[id] = s; return s; }

  s.appendChild($(`<div class="abs c ar white" id="hor" style="top:1120px;font-size:86px;font-weight:700">ولا…</div>`));
  s.appendChild($(`<div class="abs c ar shim" id="hone" style="top:1230px;font-size:150px;font-weight:700">فريق واحد.</div>`));

  'Spotlight Adz'.split('').forEach((ch, i) => nm.appendChild($(`<span style="display:inline-block;white-space:pre" id="hn${i}">${ch}</span>`)));

}

  s.appendChild($(`<div class="abs c ar" id="${id}_sub" style="top:1610px;font-size:46px;font-weight:600;color:rgba(255,255,255,.86)">${sub}</div>`));
  return s;
}

  for (let i = 0; i < 6; i++) feed.appendChild($(`<div style="position:absolute;left:0;right:0;top:${70 + i * 560}px;height:530px;border-radius:40px;
     background:linear-gradient(${140 + i * 37}deg, ${SPEC[i % 7]}, ${SPEC[(i + 3) % 7]} 60%, ${SPEC[(i + 5) % 7]})">
     <div style="position:absolute;right:26px;bottom:110px;width:54px;height:54px">${IC.social}</div>
     <div style="position:absolute;right:26px;bottom:40px;width:54px;height:54px">${IC.chat.replace('#25D366', 'transparent')}</div>
     <div style="position:absolute;left:28px;bottom:44px;width:220px;height:22px;border-radius:11px;background:rgba(255,255,255,.85)"></div>
     <div style="position:absolute;left:28px;bottom:80px;width:150px;height:22px;border-radius:11px;background:rgba(255,255,255,.6)"></div></div>`));

  for (let i = 0; i < 14; i++) s.appendChild($(`<div class="heart" id="so_hr${i}">${IC.social.replace(/fill="none" stroke="#fff"/, `fill="${SPEC[i % 7]}" stroke="${SPEC[i % 7]}"`)}</div>`));
  s.appendChild($(`<div class="abs glass pill" id="so_c1" style="left:60px;top:760px"><span class="num" style="font-size:64px;color:#fff" id="so_n1">0</span><span class="ar" style="font-size:34px;color:#fff;margin-right:14px"> متابع</span></div>`));
  s.appendChild($(`<div class="abs glass pill" id="so_c2" style="right:50px;top:1180px"><span class="num" style="font-size:64px;color:#fff" id="so_n2">0</span><span class="ar" style="font-size:34px;color:#fff;margin-right:14px"> مشاهدة</span></div>`));
  s.appendChild($(`<div class="abs it" id="so_cap" style="left:80px;top:880px;font-size:28px;color:rgba(255,255,255,.75)">Happy Fitness</div>`));
}

  s.querySelector('#sys_sub').classList.remove('ar'); s.querySelector('#sys_sub').classList.add('sg');

  const lt = t - a;
  S(E('pr_h'), { o: eo(P(lt, .05, .2)), s: .8 + .2 * es(P(lt, .05, .6)) });
  for (let i = 0; i < 5; i++) { const st = .45 + i * BEAT * 1.25, en = st + BEAT * 1.25; const p = es(P(lt, st, .4), 8, 14);
    const on = lt >= st && (lt < en || i === 4);
    S(E('pr_n' + i), { o: on ? eo(P(lt, st, .06)) : 0, s: 1.5 - .5 * p, blur: (1 - eo(P(lt, st, .12))) * 16 });
    E('pr_n' + i).querySelector('.shim').style.backgroundPosition = `${t * 40}% 0`; }
}
function aCta(t, a) {
  const lt = t - a;
  const lg = es(P(lt, .1, 1.0)); S(E('ct_logo'), { o: eo(P(lt, .1, .2)), s: Math.max(.01, lg) * (1 + .03 * Math.sin(lt * 2.5)) });
  S(E('ct_ring'), { o: eo(P(lt, .2, .4)) * .9, s: .6 + .4 * eo(P(lt, .2, .8)) });
  for (let i = 0; i < 6; i++) { const ang = lt * .6 + i * Math.PI / 3 - Math.PI / 2; const p = es(P(lt, .4 + i * .08, .8));
    const el = E('ct_i' + i); el.style.left = '485px'; el.style.top = '575px';
    S(el, { x: Math.cos(ang) * 300 * p, y: Math.sin(ang) * 300 * p, o: eo(P(lt, .4 + i * .08, .2)), s: .6 + .4 * p }); }
  S(E('ct_1'), { o: eo(P(lt, .5, .25)), y: (1 - eo(P(lt, .5, .5))) * 40 });
  const c2 = E('ct_2'); S(c2, { o: eo(P(lt, 1.2, .2)), s: .6 + .4 * es(P(lt, 1.2, .8)) }); c2.style.backgroundPosition = `${t * 30}% 0`;
  const pulse = 1 + .03 * Math.sin(Math.max(0, lt - 2.2) * 5);
  S(E('ct_btn'), { o: eo(P(lt, 1.9, .3)), s: (.8 + .2 * es(P(lt, 1.9, .7))) * pulse });
  S(E('ct_num'), { o: eo(P(lt, 2.4, .3)), y: (1 - eo(P(lt, 2.4, .5))) * 30 });
  S(E('ct_web'), { o: eo(P(lt, 2.7, .3)) });
}

// ---------------- timeline ----------------
const TL = [
  ['hook', 0, T.logoEnd, aHook, 0],
  ['social', T.svc(0), T.svc(1), aSocial], ['ads', T.svc(1), T.svc(2), aAds], ['web', T.svc(2), T.svc(3), aWeb],
  ['sys', T.svc(3), T.svc(4), aSys], ['brand', T.svc(4), T.svc(5), aBrand], ['ai', T.svc(5), T.proof, aAI],
  ['proof', T.proof, T.cta, aProof], ['cta', T.cta, T.end + 1, aCta]];
window.CUTS = TL.slice(1).map(x => x[1]);
window.HITS = [];   // exported for the audio side

function globalFX(t) {
  // edge glow: off in hook start, ignites at logo, full in AI + CTA
  let edge = .25 + .75 * eo(P(t, 6.4, 1.1));
  if (t > T.svc(5) && t < T.proof) edge = 1.25;
  if (t > T.cta) edge = 1.2;
  if (t < 3.75) edge = .18 * eo(P(t, 1, 2));
  U.uEdge.value = edge;
  U.uEnergy.value = t < 3.75 ? .35 : t < 7.5 ? .55 + .3 * eo(P(t, 3.75, 1)) : .85;
  // warp on every cut
  let warp = 0; for (const c of [3.75, ...window.CUTS]) { const d = t - c; if (d > -.3 && d < .35) warp = Math.max(warp, (d < 0 ? eo((d + .3) / .3) : 1 - eo(d / .35)) * .7); }
  U.uWarp.value = warp;
  // flash on cuts + hook tile slams
  let fl = 0; for (const c of [3.75, 7.5, ...window.CUTS]) { const d = t - c; if (d >= 0 && d < .16) fl = Math.max(fl, (1 - d / .16) * .32); }
  for (let i = 0; i < 6; i++) { const d = t - (BEAT * 2 + i * BEAT * .82); if (d >= 0 && d < .12) fl = Math.max(fl, (1 - d / .12) * .18); }
  U.uFlash.value = fl * .35; document.getElementById('flash').style.opacity = fl;
  U.uHue.value = t * .01; U.uT.value = t;
  // beat punch + shake
  let sc = 1, sx = 0, sy = 0;
  if (t > 7.5 && t < T.end) { const bt = (t - 7.5) % BEAT; sc += .012 * Math.exp(-bt / .09); }
  for (const c of [3.75, 7.5, ...window.CUTS]) { const d = t - c; if (d >= 0 && d < .4) { const k = Math.exp(-d / .1); sc += .06 * k; sx += (hash(Math.floor(t * 60)) - .5) * 30 * k; sy += (hash(Math.floor(t * 60) + 7) - .5) * 30 * k; } }
  stage.style.transform = `translate(${sx}px,${sy}px) scale(${sc})`;
}

window.seek = (t) => {
  globalFX(t);
  for (const [id, a, b, fn] of TL) {
    const el = scenes[id];
    const on = t >= a - .02 && t < b + .02;
    el.style.display = on ? 'block' : 'none';
    if (on) { const e = sceneEnv(t, a, b, id === 'hook' ? .01 : .3, id === 'cta' ? .01 : .3); S(el, { o: e.o, s: e.s, blur: e.blur }); fn(t, a); }
  }
  renderer.render(scene, cam);
  return true;
};
function fitHeads() { Object.values(scenes).forEach(sc => sc.style.display = 'block');
  document.querySelectorAll('.fit').forEach(sp => { const box = sp.parentElement; let fs = parseFloat(getComputedStyle(box).fontSize);
  while (sp.getBoundingClientRect().width > 940 && fs > 60) { fs -= 4; box.style.fontSize = fs + 'px'; } });
  Object.values(scenes).forEach(sc => sc.style.display = 'none'); }
window.ready = Promise.all(['500 50px Readex','600 50px Readex','700 50px Readex','500 50px SG','600 50px SG','700 50px SG','500 50px IT'].map(f => document.fonts.load(f, 'أبAa'))).then(() => document.fonts.ready).then(() => fitHeads()).then(() => Promise.all([...document.images].map(i => i.decode().catch(() => 0)))).then(() => true);
</script>
